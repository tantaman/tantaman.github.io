<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hand-written WASM editor, drawn by itself</title>
  <meta name="description" content="A rich text editor that lays out, paints and handles input entirely in hand-written WebAssembly. The page only copies pixels onto a canvas.">
  <link rel="icon" href="data:,">
  <!-- The whole page is one canvas that canvas.wasm paints; the only other
       element is the invisible textarea the host uses to receive typing, IME
       and the clipboard (src/canvas.ts). -->
  <style>
    html, body, #editor { height: 100%; margin: 0; }
    body { background: #fff; overflow: hidden; }
    @media (prefers-color-scheme: dark) { body { background: #16181d; } }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script type="module" src="./src/canvas-demo.ts"></script>
</body>
</html>
