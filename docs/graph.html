{"id":"2013-06-28-services-and-coupling.md","label":"Services and Coupling","title":"Services and Coupling\nblog\nTags: software","url":"2013-06-28-services-and-coupling.html","fullTitle":"Services and Coupling","description":"Direct instantiation of implementations creates tight coupling between classes, and while dependency injection improves this by passing dependencies as parameters, it still leaves components with hard dependencies on concrete implementations. A service-oriented approach solves this by having the provider of an implementation be responsible for instantiating it, with all lookups happening through a registry that matches interface names and metadata rather than concrete types, allowing components to depend only on capability descriptions instead of specific implementations. Languages like Java have OSGi and JavaScript has AngularJS to implement service-oriented architectures, enabling truly decoupled and reusable components.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#b69435","x":4.898587196589413e-14,"y":-800},
{"id":"2013-07-30-Inheritance-Aggregation-and-Pipelines.mdx","label":"Inheritance, Aggregation, and Pipelines","title":"Inheritance, Aggregation, and Pipelines\nblog\nTags: software","url":"2013-07-30-Inheritance-Aggregation-and-Pipelines.html","fullTitle":"Inheritance, Aggregation, and Pipelines","description":"Inheritance is too rigid for extensible software because relationships are fixed at compile time, while aggregation allows flexible runtime composition but makes it difficult to add or remove components mid-chain. Pipelines solve these problems by having a separate class manage a list of composable handlers, enabling easy modification of the processing chain without touching individual components and allowing flexible control flow through context objects.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#ac6f21","x":-58.98951024626553,"y":-745.960776459078},
{"id":"2013-08-15-Oh-Lisp.md","label":"Oh Lisp","title":"Oh Lisp\nblog\nTags: software","url":"2013-08-15-Oh-Lisp.html","fullTitle":"Oh Lisp","description":"Lisp deserves recognition as a powerful language that, like XML, uses minimal syntax to represent both data and programs in a flexible, domain-specific way. The key advantage of Lisp is that code and data are interchangeable—code exists as lists that can be manipulated by functions and macros, allowing programmers to create tailored languages and solve problems with minimal syntactic overhead, much like how XML enables custom formats and XSLT enables transformations.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#a27950","x":9.89109164760176,"y":-912.7038877147489},
{"id":"2014-01-01-The-Almighty-Function.md","label":"The Almighty Function","title":"The Almighty Function\nblog\nTags: software","url":"2014-01-01-The-Almighty-Function.html","fullTitle":"The Almighty Function","description":"The post argues that everything—maps, arrays, and objects—can be fundamentally understood and implemented as functions, demonstrating this through JavaScript examples of pairs and objects built using closures and higher-order functions. By reconceptualizing data structures and objects as functions rather than discrete entities, programmers can gain new perspectives on software design and discover novel applications for closures, challenging the conventional view that objects are the primary programming abstraction. The exploration reveals the deep philosophical equivalence between objects and closures, suggesting that neither is inherently superior but rather each provides a different lens for thinking about computation.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#a4bf4d","x":84.30776164117819,"y":-690.035454227036},
{"id":"2014-01-03-Practical-Laziness-in-Programming.md","label":"Practical Laziness in Programming","title":"Practical Laziness in Programming\nblog\nTags: software","url":"2014-01-03-Practical-Laziness-in-Programming.html","fullTitle":"Practical Laziness in Programming","description":"Lazy evaluation enables more composable and maintainable APIs by allowing developers to chain operations on collections without forcing immediate computation or consuming excessive memory. The author demonstrates this through a Javadoc-to-JSON conversion project, showing how lazy sequences let you write clean, functional-style code that processes data in streaming fashion rather than requiring imperative loops with callback hooks. Languages like Clojure and Scala provide built-in lazy evaluation, offering a practical alternative to the verbose callback patterns that would otherwise be necessary in eager languages like Java.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#bd923a","x":-157.55415765046854,"y":-827.8691120606899},
{"id":"2018-10-23-typed-literals-are-constants.md","label":"Typed Literals ARE Constants!","title":"Typed Literals ARE Constants!\nblog\nTags: software","url":"2018-10-23-typed-literals-are-constants.html","fullTitle":"Typed Literals ARE Constants!","description":"Typed string literals in TypeScript are functionally equivalent to named constants because the type system provides the same compile-time checking and refactoring benefits as explicit constant objects. When a function parameter is typed with a union of string literals, using the literal directly (e.g., `'FIXED'`) versus referencing it through a constant (e.g., `Layouts.FIXED`) offers no practical advantage, since both approaches will produce the same compiler errors if the type definition changes, making the extra constant definition unnecessary.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#c08e37","x":150.9355356460717,"y":-896.0128328882834},
{"id":"2020-05-17-I-Am-You-Are.md","label":"I am. You are?","title":"I am. You are?\nblog\nTags: philosophy","url":"2020-05-17-I-Am-You-Are.html","fullTitle":"I am. You are?","description":"The post argues that we misidentify ourselves with our emotions when we say \"I am angry\" or \"I am upset,\" when more accurately we are experiencing those emotions without being defined by them, and that this linguistic distinction matters for how we understand our relationship to our feelings.","tags":["philosophy"],"collection":"blog","related":[],"cluster":1,"sentimentColor":"#a5c75e","x":306.14674589207186,"y":-739.1036260090294},
{"id":"2020-05-17-dangerous-ideas.md","label":"Dangerous. Ideas.","title":"Dangerous. Ideas.\nblog\nTags: philosophy","url":"2020-05-17-dangerous-ideas.html","fullTitle":"Dangerous. Ideas.","description":"The phrase \"a little bit of knowledge is a dangerous thing\" can mean either that partial knowledge grants dangerous power or that incomplete knowledge puts oneself at risk, yet people recognize the need for proper frameworks when handling physical dangers like power tools but fail to apply the same caution to beliefs and ideas, which require equally respectful and informed approaches to avoid harm.","tags":["philosophy"],"collection":"blog","related":[],"cluster":2,"sentimentColor":"#8d8b8a","x":565.685424949238,"y":-565.6854249492379},
{"id":"2020-05-19-These-Are-Not-Types.md","label":"These are not types","title":"These are not types\nblog\nTags: software","url":"2020-05-19-These-Are-Not-Types.html","fullTitle":"These are not types","description":"Storage types like int, float, and string operate at the wrong level of abstraction for application-level code and fail to communicate semantic meaning about what data represents. Instead of using primitive types, applications should define domain-specific types that express intent—such as ID<User> rather than int—making code more expressive and safer by preventing type mismatches at the source. This approach acknowledges that real application types should capture not just how data is stored, but what that data actually represents in the business domain.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#c19557","x":-50.87184656308418,"y":-610.759266469235},
{"id":"2020-05-25-Non-Conceptual-Definitions.md","label":"Non Conceptual Definitions","title":"Non Conceptual Definitions\nblog\nTags: philosophy","url":"2020-05-25-Non-Conceptual-Definitions.html","fullTitle":"Non Conceptual Definitions","description":"Certain concepts like \"art\" and \"love\" resist solid conceptual definitions because they are fundamentally defined by concrete examples rather than abstract principles, making them non-conceptual words whose meaning varies between individuals and cultures. The inability to establish universal definitions for these terms makes meaningful conversation difficult, as people inevitably rely on different criteria, and perhaps these words are better understood as enumerations of whatever a culture designates as such at any given time rather than unified by an underlying principle. While this approach to defining terms may discourage rigorous thinking, it may more accurately reflect how these elusive human concepts actually function.","tags":["philosophy"],"collection":"blog","related":[],"cluster":2,"sentimentColor":"#8cbe81","x":506.69591470297246,"y":-511.646201408316},
{"id":"2020-06-29-all-things-are-permitted.md","label":"All Things are Permitted","title":"All Things are Permitted\nblog\nTags: philosophy","url":"2020-06-29-all-things-are-permitted.html","fullTitle":"All Things are Permitted","description":"The post reinterprets the phrase \"if there is no God then all things are permitted\" by arguing that all things are naturally permitted by physical reality regardless of God's existence, and that laws exist specifically to restrict these naturally permitted actions; the real meaning of the quote is therefore an appeal to moral authority and how things ought to be, distinguishing between the permissible in nature and the permissible in an ethical framework.","tags":["philosophy"],"collection":"blog","related":[],"cluster":3,"sentimentColor":"#87a5a6","x":739.1036260090294,"y":-306.1467458920718},
{"id":"2020-09-13-declarative.md","label":"Filter, Map, etc. vs For Each & While","title":"Filter, Map, etc. vs For Each & While\nblog\nTags: software","url":"2020-09-13-declarative.html","fullTitle":"Filter, Map, etc. vs For Each & While","description":"Some programmers find functional collection methods like map and filter harder to understand than imperative loops, but this resistance stems from unfamiliarity rather than actual complexity. Programming fundamentally involves upleveling language by identifying common patterns, abstracting them, and naming them, so adopting functional methods expands our ability to express solutions clearly and concisely. Refusing to learn these concepts is refusing to grow, much like a language that stops evolving; encountering unfamiliar ideas should prompt learning rather than recasting them in familiar terms.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#af9a3b","x":-97.55562919314205,"y":-987.8374276142275},
{"id":"2021-01-21-false-positive-rate.md","label":"Understanding False Positive Rate","title":"Understanding False Positive Rate\nblog\nTags: software, math","url":"2021-01-21-false-positive-rate.html","fullTitle":"Understanding False Positive Rate","description":"A positive test result does not necessarily reflect your actual probability of having a disease because the false positive rate alone is misleading without accounting for disease prevalence in the population. For example, a test with a 0.5% false positive rate could still result in 50-90% of positive results being incorrect if the disease is rare, since most people tested don't have the disease. Understanding this relationship between prevalence, false positive rate, and true positive probability is essential for correctly interpreting test results and case numbers during health crises.","tags":["software","math"],"collection":"blog","related":[],"cluster":4,"sentimentColor":"#875d46","x":800,"y":0},
{"id":"2021-01-26-regression-mean-vs-gambler.md","label":"Regression to the Mean & the Gambler'...","title":"Regression to the Mean & the Gambler's Fallacy - Simulated\nblog\nTags: software, math","url":"2021-01-26-regression-mean-vs-gambler.html","fullTitle":"Regression to the Mean & the Gambler's Fallacy - Simulated","description":"Regression to the mean and the gambler's fallacy appear contradictory but are actually compatible phenomena that both apply to independent events like coin tosses. Using a simulation of coin flips, the post demonstrates that while the next single flip after a streak has a 50/50 probability of heads or tails (disproving the gambler's fallacy), a sequence of flips immediately following an extreme streak tends to be closer to the mean of 50/50 split (confirming regression to the mean). The key distinction is that regression to the mean describes what happens across multiple future events while the gambler's fallacy incorrectly assumes past results influence individual future outcomes.","tags":["software","math"],"collection":"blog","related":[],"cluster":4,"sentimentColor":"#917555","x":741.0104897537344,"y":54.03922354092191},
{"id":"2021-02-07-volatility-isnt-risk.md","label":"Volatility isn't Risk","title":"Volatility isn't Risk\nblog\nTags: economics","url":"2021-02-07-volatility-isnt-risk.html","fullTitle":"Volatility isn't Risk","description":"Volatility and risk are fundamentally different concepts—volatility is merely price fluctuation while risk is the actual chance of losing principal—and confusing them leads investors to avoid profitable investments with upward trends despite short-term swings. The difficulty of timing volatile investments causes many to mistake volatility for risk, but this can be mitigated through long-term holding periods and dollar-cost averaging, which smooth out purchase prices and returns closer to the mean. Proper risk assessment requires deeper analysis beyond historical price movements, particularly for emerging investments where timing decisions should be based on fundamental valuations rather than volatility patterns.","tags":["economics"],"collection":"blog","related":[],"cluster":4,"sentimentColor":"#9a5e3d","x":809.8910916476017,"y":-112.70388771474897},
{"id":"2021-02-08-reactive-markdown.md","label":"Reactive Markdown","title":"Reactive Markdown\nblog\nTags: software","url":"2021-02-08-reactive-markdown.html","fullTitle":"Reactive Markdown","description":"The author explores a system called \"Reactive Markdown\" that allows markdown content in blog posts to automatically update when underlying JavaScript variables change, eliminating the need to manually shuttle data between markdown and JavaScript code. The current implementation is JavaScript-first, requiring markdown to be written within JS templates, but the author plans to eventually create a markdown-first version that would be more ergonomic for blog writing. This approach aims to minimize boilerplate code while keeping display formatting concerns centralized in the markdown document.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#cf862f","x":212.54414666999122,"y":-722.3792185279915},
{"id":"2021-02-12-Todo-MVC.md","label":"The Shortest, Framework Free, TODO App","title":"The Shortest, Framework Free, TODO App\nblog\nTags: software","url":"2021-02-12-Todo-MVC.html","fullTitle":"The Shortest, Framework Free, TODO App","description":"A fully functional TodoMVC application can be built in approximately 200 lines of vanilla JavaScript without any external dependencies or frameworks, using a simple template literal-based rendering system and localStorage for persistence. The implementation demonstrates that complex interactive applications don't require heavy frameworks, utilizing plain DOM manipulation, event handlers, and a straightforward state management pattern to achieve all standard todo app features including filtering, editing, and task completion tracking.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#d8b242","x":-221.8429334730731,"y":-708.4264619660153},
{"id":"2021-02-14-Pi-Cloud.mdx","label":"Pi Cloud","title":"Pi Cloud\nblog\nTags: software","url":"2021-02-14-Pi-Cloud.html","fullTitle":"Pi Cloud","description":"Building a personal cloud infrastructure on Raspberry Pis teaches developers about low-level systems that underpin modern cloud services, countering the trend of relying entirely on abstraction layers like AWS and Azure. The author argues that understanding how systems fail at every level of the stack is crucial, illustrated by an example where a hardware-level Intel chip bug cascaded up to break user authentication. This series will document building a complete, production-grade cloud system with eighteen core components including load balancers, databases, caching, monitoring, and deployment systems, emphasizing a \"monitoring-driven development\" approach where every component is fully observable before moving forward.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#976246","x":107.22549771934769,"y":-1029.134660492118},
{"id":"2021-03-01-Nic-Cage-Genre.md","label":"Nicolas Cage is Creating a new Movie...","title":"Nicolas Cage is Creating a new Movie Genre\nblog\nTags: fiction","url":"2021-03-01-Nic-Cage-Genre.html","fullTitle":"Nicolas Cage is Creating a new Movie Genre","description":"Nicolas Cage is gradually establishing a distinctive new film genre characterized by trippy, artistic horror movies that can be summed up in one word: purple. The post explores whether Cage is intentionally creating this unique aesthetic or doing so accidentally through his recent film choices.","tags":["fiction"],"collection":"blog","related":[],"cluster":5,"sentimentColor":"#a59684","x":739.1036260090294,"y":306.1467458920718},
{"id":"2021-04-05-Religion-Last.md","label":"What if Religion is last?","title":"What if Religion is last?\nblog\nTags: philosophy, politics","url":"2021-04-05-Religion-Last.html","fullTitle":"What if Religion is last?","description":"Religion might represent either a civilization's final stage before collapse, as exemplified by Rome's transition from rationalism to Christianity amid decadence, or conversely, a peak cultural achievement representing humanity's mature understanding that reason alone cannot determine how people choose to live and believe. The post explores whether contemporary American hyper-partisanship and ideological tribalism constitute a new religion emerging from societal breakdown, while acknowledging that this theory requires substantial historical evidence across multiple civilizations and assumes conditions in past societies that may never have actually existed.","tags":["philosophy","politics"],"collection":"blog","related":[],"cluster":2,"sentimentColor":"#42639b","x":575.5765165968397,"y":-678.3893126639869},
{"id":"2021-08-22-Understanding-Generics.md","label":"Understanding Generics","title":"Understanding Generics\nblog\nTags: software","url":"2021-08-22-Understanding-Generics.html","fullTitle":"Understanding Generics","description":"Generics exist primarily to allow callers to preserve and pass along type information through function calls and containers, rather than to serve the implementation of the called function itself. Whether a function accepts `any`, `number`, or `Object`, the implementation remains the same, but using generics enables callers to retain knowledge of the actual types involved and use that information for subsequent operations. This is demonstrated through simple examples like the identity function and generic containers, where the caller benefits from type safety even after wrapping values in generic structures.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#b8ab47","x":79.4089827336985,"y":-546.8316499615341},
{"id":"2021-12-15-React-Anemic-Models.md","label":"Reacting Better. Intro: Anemic Models","title":"Reacting Better. Intro: Anemic Models\nblog\nTags: software","url":"2021-12-15-React-Anemic-Models.html","fullTitle":"Reacting Better. Intro: Anemic Models","description":"React applications typically use anemic data models—plain objects with properties but no attached methods—which works well for simple apps but becomes problematic when most business logic lives client-side, models need type-specific behavior, or third parties need to extend functionality. As anemic models accumulate type fields and require scattered switch statements across functions, they create code organization issues and the expression problem where new types force modifications to existing functions, yet introducing traditional classes with behavior conflicts with React's immutability expectations and data fetching patterns. The post explores how to bridge this gap by developing mutation primitives that enable immutable domain models within the React ecosystem.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#b88020","x":-239.77436393131632,"y":-938.9541449591651},
{"id":"2021-12-16-Missing-Mutation-Primitives.md","label":"🧬 Missing Mutation Primitives","title":"🧬 Missing Mutation Primitives\nblog\nTags: software","url":"2021-12-16-Missing-Mutation-Primitives.html","fullTitle":"🧬 Missing Mutation Primitives","description":"Object-oriented languages lack proper mutation primitives to express, commit, and record changes atomically, making it impossible to handle rollbacks on partial failures, prevent intermediate observations by listeners, or support undo functionality reliably. The author proposes introducing changesets as a language feature that represent all intended mutations without performing them, allowing mutations to be composed and committed atomically in a single operation, thereby solving the core problems with mutable state in OO design.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#b38239","x":281.7163665055879,"y":-861.9345528997285},
{"id":"2021-12-17-Object-Identity.mdx","label":"⛵️ Reference Equality - What is it Re...","title":"⛵️ Reference Equality - What is it Really?\nblog\nTags: software","url":"2021-12-17-Object-Identity.html","fullTitle":"⛵️ Reference Equality - What is it Really?","description":"Reference equality is commonly conflated with identity, but this conflation breaks down when examining the philosophical distinction between nominal identity (continuity of concept over time) and physical identity (exact composition at a moment). In mutable systems, reference equality functions as nominal identity because a reference can point to an object as it changes over time, but in immutable systems, reference equality only captures physical identity since every change requires creating a new object with a new reference. The solution adopted by relational databases—using stable IDs as nominal identities while allowing mutation and version history—offers a model that software systems with immutable data structures lack.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#8f912a","x":-172.1549821513428,"y":-555.1272532100177},
{"id":"2021-12-20-American-Spirit.md","label":"👐 American Spirit","title":"👐 American Spirit\nblog\nTags: politics, philosophy","url":"2021-12-20-American-Spirit.html","fullTitle":"👐 American Spirit","description":"A Nietzschean critique argues that contemporary American culture has become fundamentally weakened by its intolerance for pain and struggle, instead seeking constant comfort through technology and distraction while paradoxically blaming external forces for its failures. The author claims both conservative and liberal Americans are hypocrites who profess ideals while embodying their opposites—conservatives claim Christian self-reliance while supporting immoral leaders, while liberals preach individual freedom while enforcing conformity to group identities and victimhood narratives. This represents the ultimate degradation of Western thought: a civilization so disconnected from itself that it can no longer recognize greatness or cultivate the discipline required for genuine personal transformation and freedom.","tags":["politics","philosophy"],"collection":"blog","related":[],"cluster":6,"sentimentColor":"#456d83","x":565.685424949238,"y":565.6854249492379},
{"id":"2021-12-20-mathematician-running-the-world.md","label":"🧮 No, Mathematical Government is not...","title":"🧮 No, Mathematical Government is not a Logical Government\nblog\nTags: philosophy","url":"2021-12-20-mathematician-running-the-world.html","fullTitle":"🧮 No, Mathematical Government is not a Logical Government","description":"Mathematics cannot serve as the basis for government because mathematical models inevitably omit crucial details and variables through both intentional simplification and human ignorance, leading to irrational outcomes when viewed in broader context. Additionally, mathematics cannot determine moral values or what constitutes \"the greater good,\" since these are fundamentally aesthetic and subjective judgments that cannot be derived from logic alone, and appeals to collective good often mask the abdication of individual responsibility and theft of natural rights.","tags":["philosophy"],"collection":"blog","related":[],"cluster":2,"sentimentColor":"#7a6b69","x":649.9931865904161,"y":-455.72087917627397},
{"id":"2021-12-23-Deeply-Nested-Updates-React.mdx","label":"☢️ Reacting Better - Deeply Nested Up...","title":"☢️ Reacting Better - Deeply Nested Update Problem\nblog\nTags: software","url":"2021-12-23-Deeply-Nested-Updates-React.html","fullTitle":"☢️ Reacting Better - Deeply Nested Update Problem","description":"React inefficiently handles deeply nested updates by forcing entire component trees to re-render when a single deeply nested property changes, even though only the leaf components actually need updating. The author proposes distinguishing between nominal identity (causal links that persist over time) and physical identity (immutable snapshots) to allow components to subscribe only to the specific data they depend on, enabling selective re-renders without sacrificing unidirectional data flow. This approach, which the author is implementing as a React Hook framework in Aphrodite, would let components decide whether they depend on something nominally (re-rendering only when the identity changes) or physically (re-rendering when any attribute changes).","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#9e7f0e","x":-39.81758091209021,"y":-1107.269523790286},
{"id":"2021-12-27-Observability-Driven-Development.md","label":"👀 Observability Driven Development","title":"👀 Observability Driven Development\nblog\nTags: software","url":"2021-12-27-Observability-Driven-Development.html","fullTitle":"👀 Observability Driven Development","description":"Observability Driven Development emphasizes that passing tests alone don't guarantee a system works correctly in production; teams must continuously monitor key metrics like request latency, throughput, memory usage, and performance trends to establish baselines, detect regressions, and maintain software quality. The author discovered this practice independently while working at Facebook and found that Honeycomb.io's CTO had already coined and formalized the same concept, which goes beyond traditional test-driven development by treating production observability as a core part of the development process.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#b48f2a","x":244.68767854593386,"y":-593.7769654771762},
{"id":"2021-12-27-Personal-Vision.mdx","label":"👀 Vision","title":"👀 Vision\nblog\nTags: philosophy","url":"2021-12-27-Personal-Vision.html","fullTitle":"👀 Vision","description":"After leaving Meta after eight years, the author outlines five ambitious visions for future work: creating software that enhances human thinking through better memory and idea encoding, developing documents as a primary platform for application development, simplifying peer-to-peer and end-to-end encrypted software development to decentralize power and reduce monopolistic control, mandating that government-funded software be open source for cost savings and transparency, and humorously, buying an island to start a new nation. The first three visions represent the most developed strategic goals, focusing on converging personal knowledge capture with formal computational methods, integrating documentation with coding, and enabling accessible P2P development through relational database models.","tags":["philosophy"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#af6d5d","x":-329.56677728728897,"y":-786.3713790693847},
{"id":"2021-12-27-urls-as-display-data.md","label":"👨‍💻 URLs As Display Data","title":"👨‍💻 URLs As Display Data\nblog\nTags: software","url":"2021-12-27-urls-as-display-data.html","fullTitle":"👨‍💻 URLs As Display Data","description":"Traditional single-page applications treat URLs as a source of truth that drives application logic, but this creates dual sources of state and unnecessary coupling between components. Instead, URLs should be treated as display output derived from application state—rendered from the app's domain model rather than driving it, which simplifies state management and makes URL handling consistent with all other UI updates.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#bb7f0c","x":240.58468106804816,"y":-1039.413891066048},
{"id":"2021-12-28-Color-Picker-From-Scratch.md","label":"🌈 Understanding Color by Writing a C...","title":"🌈 Understanding Color by Writing a Color Picker\nblog\nTags: software","url":"2021-12-28-Color-Picker-From-Scratch.html","fullTitle":"🌈 Understanding Color by Writing a Color Picker","description":"Building a color picker from scratch reveals that understanding HSV (Hue, Saturation, Value) color theory makes the process far simpler than it appears, with hue controlled by a linear slider and saturation and value controlled through layered CSS gradients on a 2D field. The post demonstrates how each HSV component maps intuitively to user interactions—dividing mouse coordinates by field dimensions produces values between 0 and 1 that directly correspond to color parameters, which can then be converted back to RGB for display.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#9f9021","x":-16.10750759280521,"y":-451.66029769900234},
{"id":"2022-01-09-improving-code-sharing.md","label":"🧶 Improving Code Sharing with Yarn W...","title":"🧶 Improving Code Sharing with Yarn Workspaces\nblog\nTags: software","url":"2022-01-09-improving-code-sharing.html","fullTitle":"🧶 Improving Code Sharing with Yarn Workspaces","description":"Yarn Workspaces solves the friction of sharing code between JavaScript and TypeScript projects by keeping shared libraries as git submodules within a monorepo structure while managing their dependencies and imports seamlessly through a single yarn install and lockfile. This approach eliminates the need to repeatedly publish, deploy, and upgrade shared libraries to NPM while avoiding the dependency conflicts and import complexity that arise from traditional git submodule setups. For projects with build requirements, tools like TurboRepo can further optimize the build process across multiple interdependent packages.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#d38421","x":-229.2270723111334,"y":-1074.6906429415942},
{"id":"2022-01-17-why-fetching-earliy-is-difficult-to-express.md","label":"🌅 Expressing Early Fetches - React","title":"🌅 Expressing Early Fetches - React\nblog\nTags: software","url":"2022-01-17-why-fetching-earliy-is-difficult-to-express.html","fullTitle":"🌅 Expressing Early Fetches - React","description":"Early data fetching in React is difficult to express correctly across multiple entry points because of anemic domain models and business logic scattered in display components; the render-as-you-fetch pattern is more natural than fetch-before-render since it ensures fetches aren't missed, whereas fetch-before-render risks omitting fetch kickoffs when different events (clicks, taps, navigation) lead to the same view and require the same data, creating a challenge of how to guarantee all entry points trigger the same required fetches without duplicating fetch logic.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#cc9137","x":363.33204822441155,"y":-751.1141867915254},
{"id":"2022-04-07-your-package-is-two.mdx","label":"📦 Your One Package Might Be Two","title":"📦 Your One Package Might Be Two\nblog\nTags: software","url":"2022-04-07-your-package-is-two.html","fullTitle":"📦 Your One Package Might Be Two","description":"When creating reusable software packages, developers often overlook that there's actually a second package within—the interface package that defines the contract separate from the implementation. Extracting the interface into its own separate package allows other developers to create alternative implementations and enables downstream packages to depend only on the interface types without pulling in the heavy implementation details. The interface package should have no dependencies on the implementation, while the implementation package depends on the interface, creating a clean separation of concerns.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#cd9d28","x":-308.01335042297933,"y":-585.6923334054264},
{"id":"2022-04-25-doing-for-others.md","label":"🧚‍♂️ Past, Present, Future - Doing f...","title":"🧚‍♂️ Past, Present, Future - Doing for Others\nblog\nTags: philosophy","url":"2022-04-25-doing-for-others.html","fullTitle":"🧚‍♂️ Past, Present, Future - Doing for Others","description":"Our present circumstances are fundamentally shaped by the choices and creations of previous generations, so if we accept this reality, our responsibility should shift from improving our own material well-being to enhancing the well-being of future generations. Adopting this forward-looking perspective would foster greater respect for the past and more careful consideration of our environmental and social impacts, and cultivating beliefs like reincarnation—regardless of their literal truth—could motivate this generational mindset since beliefs themselves shape our collective future.","tags":["philosophy"],"collection":"blog","related":[],"cluster":2,"sentimentColor":"#779584","x":408.13126729876944,"y":-593.5545370099278},
{"id":"2022-04-25-foundational-myths.md","label":"🧟‍♂️ Memes & Themes - 1619 Project","title":"🧟‍♂️ Memes & Themes - 1619 Project\nblog\nTags: politics, philosophy","url":"2022-04-25-foundational-myths.html","fullTitle":"🧟‍♂️ Memes & Themes - 1619 Project","description":"Foundational myths shape societies' values and worldviews, as illustrated by how Russia and Ukraine adopted different poetic traditions leading to divergent ideologies, and the 1619 Project attempts to reshape America's foundational narrative to recognize marginalized groups' contributions. Rather than attempting a risky cultural rewrite that introduces new flaws, the author argues America should iteratively apply its existing principle of individual rights more fearlessly and consistently to all people, which already encompasses the respect and valuation of diverse groups the 1619 Project seeks to achieve.","tags":["politics","philosophy"],"collection":"blog","related":[],"cluster":6,"sentimentColor":"#3a3665","x":506.69591470297246,"y":619.7246484901598},
{"id":"2022-05-12-simple-mdx.mdx","label":"😌 Simple MDX","title":"😌 Simple MDX\nblog\nTags: software","url":"2022-05-12-simple-mdx.html","fullTitle":"😌 Simple MDX","description":"MDX deployment outside of Next.js is unnecessarily complicated, but using @mdx-js/mdx directly without bundling offers a simpler alternative by processing MDX files through a pipeline of remark and rehype plugins, then compiling them to JavaScript modules that can be imported on the frontend. The post provides a practical guide to ingesting MDX content, selecting appropriate transformations, applying them during compilation, and using the resulting JavaScript components in your application.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#ab8513","x":84.20765355293102,"y":-1174.3114626659321},
{"id":"2022-05-12-skipping-the-bundling.md","label":"🧶 Skipping the Bundling","title":"🧶 Skipping the Bundling\nblog\nTags: software","url":"2022-05-12-skipping-the-bundling.html","fullTitle":"🧶 Skipping the Bundling","description":"Modern JavaScript with ES6 modules, TypeScript, and services like esm.sh eliminate the need for bundlers on small-scale projects, allowing developers to import dependencies directly via URL without complex build tools. For simple projects like personal blogs, skipping bundlers entirely is practical and aligns with the principle of not adding unnecessary complexity until it's truly needed. The author demonstrates this approach by building their own blog without any bundler, importing all dependencies directly from URLs.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#c27c07","x":194.8543125656731,"y":-459.953243105365},
{"id":"2022-05-13-large-local-storage.md","label":"📀 Large Local Storage","title":"📀 Large Local Storage\nblog\nTags: software","url":"2022-05-13-large-local-storage.html","fullTitle":"📀 Large Local Storage","description":"In 2013, the author created Large Local Storage, a library that provided a unified interface for storing large data blobs across all browsers by abstracting over incompatible storage APIs like FileSystemAPI, WebSQL, IndexedDB, and LocalStorage. The library used a pipeline architecture with pluggable layers for caching, logging, S3 uploads, and other features, though it's now obsolete due to improved browser support for IndexedDB and the FilesystemAPI. The post reflects on the project as a historical record of the author's interests and architectural patterns, noting what design decisions they would approach differently today.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#e17a3e","x":-381.0771108786762,"y":-921.5739921379612},
{"id":"2022-05-26-chunk-iterable.md","label":"🪨 Chunk Iterable","title":"🪨 Chunk Iterable\nblog\nTags: software","url":"2022-05-26-chunk-iterable.html","fullTitle":"🪨 Chunk Iterable","description":"The Chunk Iterable Framework in Aphrodite processes large or unbounded data streams by dividing them into manageable chunks rather than processing items one at a time or all at once, which improves performance while preventing resource overload. By conforming to an Iterable interface, ChunkIterable allows operations like filter and map to be performed on chunks, enabling Aphrodite to transform raw data streams into models and apply database-level filtering efficiently.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#d19136","x":370.30757635306657,"y":-971.0914927619658},
{"id":"2022-05-26-query-builder.mdx","label":"⛓ Query Builder","title":"⛓ Query Builder\nblog\nTags: software","url":"2022-05-26-query-builder.html","fullTitle":"⛓ Query Builder","description":"Aphrodite generates type-safe query builders from schemas that enable fluent APIs for traversing graph relationships, applying filters, and performing pagination through a linked list structure where each method call returns a new query builder holding references to the previous query and its applied expression. This design allows seamless chaining of operations across different node types, such as querying users, their photos, and tagged users within those photos, with the linked list ultimately being converted to an optimized query plan before execution.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#e3a334","x":-160.4825782087522,"y":-416.5350836237144},
{"id":"2022-05-26-query-plan-optimization.mdx","label":"💨 Query Plan Optimization","title":"💨 Query Plan Optimization\nblog\nTags: software","url":"2022-05-26-query-plan-optimization.html","fullTitle":"💨 Query Plan Optimization","description":"Aphrodite's query optimizer aims to minimize database calls and reduce returned data by hoisting operations like filters, joins, and limits into database queries rather than handling them in the application layer, and by collapsing derived expressions and hop plans to their source equivalents. This optimization approach is particularly important for ORMs to avoid common performance pitfalls like the N+1 problem and becomes even more critical when queries span multiple data sources.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#bb8023","x":-143.27368994451808,"y":-1198.3373567338144},
{"id":"2022-05-26-query-planning.mdx","label":"📝 Query Planning","title":"📝 Query Planning\nblog\nTags: software","url":"2022-05-26-query-planning.html","fullTitle":"📝 Query Planning","description":"Query planning converts the linked list of queries built by a query builder into executable plans by walking the list from end to start, collecting expressions into a plan structure. For simple queries, this produces a single Plan with a source expression and ordered derivations, but queries with edge traversals (hops) generate nested HopPlans that wrap source plans, allowing the system to handle queries that span multiple tables or storage types. The planning process establishes the foundation for query optimization by organizing all expressions in the correct execution order.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#af8928","x":381.3512804760801,"y":-599.572454789133},
{"id":"2022-06-02-this-time-is-different.md","label":"🧶 HTML, CSS & JS. All mixed up toget...","title":"🧶 HTML, CSS & JS. All mixed up together. This time it's different.\nblog\nTags: software","url":"2022-06-02-this-time-is-different.html","fullTitle":"🧶 HTML, CSS & JS. All mixed up together. This time it's different.","description":"Modern web development combines HTML, CSS, and JavaScript back together, but this represents genuine progress rather than regression because developers are now bundling these technologies at the component level rather than globally, allowing for proper code organization and reduced complexity after the evolution of templates, imports, and module systems made true component-based development possible. The criticism that inline styles and mixed code represent a step backward misses the key distinction: past separation was based on incidental technical boundaries across all components, while current practices bundle only a single component's resources together, achieving both modularity and maintainability.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#b17500","x":-423.7050274296157,"y":-688.3127145514383},
{"id":"2022-06-06-not-machine-readable.md","label":"📚 Not Machine Readable?","title":"📚 Not Machine Readable?\nblog\nTags: software","url":"2022-06-06-not-machine-readable.html","fullTitle":"📚 Not Machine Readable?","description":"The term \"machine readable\" is imprecise because it doesn't account for the semantic gap between data structures and specific consumer needs; data is only readable when a programmer's task aligns with both the structure's format and its underlying ontology, meaning even formally structured data fails to be \"machine readable\" if its terminology and concepts don't match the consumer's requirements.","tags":["software"],"collection":"blog","related":[],"cluster":2,"sentimentColor":"#a8975e","x":716.6209605953097,"y":-661.6982578375213},
{"id":"2022-06-16-always-a-body.md","label":"You'll always have a body","title":"You'll always have a body\nblog\nTags: philosophy","url":"2022-06-16-always-a-body.html","fullTitle":"You'll always have a body","description":"Even if consciousness could be uploaded digitally, it would still require a body-like structure because consciousness fundamentally depends on limitations that constrain perspective and processing capacity. A digital mind would still face the basic constraint that it cannot perceive or process everything simultaneously, requiring it to either navigate toward data or have data brought to it, much like a physical body moves through and observes its environment. The body is ultimately an essential feature of any conscious entity—not as flesh and blood specifically, but as a limiting observer positioned within an environment.","tags":["philosophy"],"collection":"blog","related":[],"cluster":2,"sentimentColor":"#82d65c","x":514.8135783861538,"y":-376.44469141847287},
{"id":"2022-08-23-why-sqlite-why-now.md","label":"Why SQLite? Why Now? 🐇","title":"Why SQLite? Why Now? 🐇\nblog\nTags: software","url":"2022-08-23-why-sqlite-why-now.html","fullTitle":"Why SQLite? Why Now? 🐇","description":"SQLite is well-suited for edge and distributed computing because it can be embedded directly on devices, but it lacks sync protocols and eventual consistency support—problems that can be solved by adding an eventually consistent layer on top of it. The author argues that by enabling eventual consistency in relational databases, developers can build local-first applications where data lives on users' devices first and syncs later, eliminating the need for constant round-trips to centralized servers and overcoming latency limitations imposed by the speed of light.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#996f3a","x":240.9005668562584,"y":-1174.6557311563956},
{"id":"2022-10-18-lamport-clock.md","label":"Lamport Clock 🕥","title":"Lamport Clock 🕥\nblog\nTags: software","url":"2022-10-18-lamport-clock.html","fullTitle":"Lamport Clock 🕥","description":"Lamport clocks are logical clocks that order events in distributed systems by tracking message exchanges between processes rather than relying on physical clocks, which are difficult to synchronize and don't accurately capture causality. The Lamport clock guarantees that if event A happened before event B, then Clock(A) < Clock(B), but cannot distinguish between concurrent and causally ordered events, making it suitable for systems like last-write-wins registers that don't require finer-grained causal resolution. Implementation involves each participant maintaining a counter that increments with local events and updates to the maximum of its local clock and received clock values during message exchanges, though this simple design cannot account for causal information transmitted through external channels.","tags":["software"],"collection":"blog","related":[],"cluster":7,"sentimentColor":"#c38fa7","x":306.14674589207186,"y":739.1036260090294},
{"id":"2022-10-18-lamport-sufficient-for-lww.md","label":"Do LWW Registers Need Vector Clocks o...","title":"Do LWW Registers Need Vector Clocks or Causal Graphs? 💭\nblog\nTags: software","url":"2022-10-18-lamport-sufficient-for-lww.html","fullTitle":"Do LWW Registers Need Vector Clocks or Causal Graphs? 💭","description":"Lamport clocks are sufficient for last-write-wins registers because LWW only needs to determine that one write could not have happened before another, not whether events are strictly ordered or concurrent—information that vector clocks and causal graphs provide but that LWW discards during conflict resolution anyway. Vector clocks and causal graphs become necessary for multi-value registers that need to distinguish between concurrent and strictly ordered edits, and for systems with many LWW registers where maintaining causal history can help preserve transactional guarantees during merges.","tags":["software"],"collection":"blog","related":[],"cluster":7,"sentimentColor":"#b8829b","x":247.15723564580628,"y":793.1428495499513},
{"id":"2022-10-19-meta-scales-mysql.md","label":"Meta / Facebook - How a graph model c...","title":"Meta / Facebook - How a graph model can scale your relational DBs\nblog\nTags: software","url":"2022-10-19-meta-scales-mysql.html","fullTitle":"Meta / Facebook - How a graph model can scale your relational DBs","description":"Despite using MySQL, Meta scales to billions of users by constraining data access to a graph model rather than allowing the full flexibility of relational queries—requiring all queries to start from a primary key and restricting joins to foreign key traversals. These constraints solve the scaling problem of partitioned databases by eliminating the need for complex routing logic and fan-out queries across multiple machines, while naturally limiting query scope since nodes have far fewer edges than entire tables. The graph model aligns well with how applications typically access data anyway, starting from known entry points like a logged-in user and traversing relationships a few hops away.","tags":["software"],"collection":"blog","related":[],"cluster":0,"sentimentColor":"#9a6139","x":76.65090569530257,"y":-353.99031551311595},
{"id":"2025-01-01-david-graeber-the-utopia-of-rules.md","label":"David Graeber The Utopia Of Rules","title":"David Graeber The Utopia Of Rules\nblog\nTags: economics, politics","url":"2025-01-01-david-graeber-the-utopia-of-rules.html","fullTitle":"David Graeber The Utopia Of Rules","description":"Graeber argues that while his earlier work correctly identified how modern economic and political structures are historically contingent rather than natural, he missed the crucial insight that knowing another world is possible doesn't mean humans are capable of building it, because the same will to power and informal hierarchies that characterize formal systems inevitably emerge in supposedly egalitarian spaces like Occupy Wall Street. The problem isn't just the structures we've inherited but the human tendency toward domination that persists regardless of ideology, making even anarchist movements reproduce the hierarchies they claim to oppose.","tags":["economics","politics"],"collection":"blog","related":[],"cluster":8,"sentimentColor":"#11a489","x":4.898587196589413e-14,"y":800},
{"id":"2025-01-01-financial-power-and-imperial-rule.md","label":"Financial Power And Imperial Rule","title":"Financial Power And Imperial Rule\nblog\nTags: economics, history","url":"2025-01-01-financial-power-and-imperial-rule.html","fullTitle":"Financial Power And Imperial Rule","description":"Financial power fundamentally rests on the capacity to mobilize other people's purchasing power at scale through control of money creation, credit terms, and liquidity provision, and Britain's rise to global dominance between 1688 and World War I exemplifies how this financial architecture translates into imperial control. Britain's constitutional settlement after the Glorious Revolution made the state's debt credible by binding the Crown to parliamentary consent for taxation, dramatically lowering borrowing costs and enabling sustained military expenditure that rivals could not match. The founding of the Bank of England in 1694 operationalized this advantage by converting future tax revenues into present purchasing power for war finance, while nineteenth-century London became the world's financial clearing house through sterling-denominated bills of exchange and bank acceptances, granting Britain seigniorage on global commerce and the ability to finance activity far beyond its actual wealth.","tags":["economics","history"],"collection":"blog","related":[],"cluster":4,"sentimentColor":"#562199","x":884.3077616411781,"y":109.96454577296396},
{"id":"2025-01-01-resurrecting-ted-kaczynski.md","label":"Resurrecting Ted Kaczynski","title":"Resurrecting Ted Kaczynski\nblog\nTags: politics, culture","url":"2025-01-01-resurrecting-ted-kaczynski.html","fullTitle":"Resurrecting Ted Kaczynski","description":"The post argues that modern liberal society has systematized psychological control through two interlocking mechanisms: trauma culture, which institutionalizes suffering and creates permanent dependency on therapeutic systems, and white guilt, which weaponizes oversocialization to silence and ensure compliance from those designated as oppressors while granting unquestionable moral authority to designated victims. Together these create a closed ideological system that disables rational discourse and makes rebellion structurally impossible by making subjugated individuals demand their own subjugation while rendering the controllers invisible.","tags":["politics","culture"],"collection":"blog","related":[],"cluster":6,"sentimentColor":"#056a87","x":575.5765165968397,"y":452.98153723448894},
{"id":"2025-01-01-the-architecture-of-meaning-a-deeper.md","label":"The Architecture Of Meaning A Deeper","title":"The Architecture Of Meaning A Deeper\nblog\nTags: philosophy, religion","url":"2025-01-01-the-architecture-of-meaning-a-deeper.html","fullTitle":"The Architecture Of Meaning A Deeper","description":"Materialism fails to account for meaning, ethics, and human longing, leaving contemporary life structured by despair that takes three forms: unconscious absorption in external pursuits, the wish to escape selfhood, and exhausting self-optimization through one's own power alone. Drawing on Kierkegaard, Pascal, and Weil, the essay argues that this despair operates through systematic mechanisms of distraction and a gravitational pull toward self-expansion that prevents genuine confrontation with one's condition, with only grace or spiritual transformation offering a path beyond these patterns.","tags":["philosophy","religion"],"collection":"blog","related":[],"cluster":2,"sentimentColor":"#10b0ac","x":468.129795756096,"y":-753.5228525634654},
{"id":"2025-01-01-the-capture-of-american-power-peter.md","label":"The Capture Of American Power Peter","title":"The Capture Of American Power Peter\nblog\nTags: politics, philosophy","url":"2025-01-01-the-capture-of-american-power-peter.html","fullTitle":"The Capture Of American Power Peter","description":"American power has shifted from the Epstein-class elite to a new \"Thiel class\" of technologists who control digital infrastructure, guided by Peter Thiel's sophisticated operationalization of René Girard's mimetic theory—which explains desire as imitative and rivalry as contagious—to achieve monopolistic positions, manipulate scapegoating mechanisms, and systematically transform the American state from positive governance into a coercive apparatus serving oligarchic interests. Thiel has openly articulated this framework in his 2007 essay \"The Straussian Moment,\" and his subsequent ventures including Palantir, Facebook investment, Trump alliance, and DOGE project represent deliberate applications of Girardian principles to accumulate power through understanding and engineering mimetic desire, preventing rivals, and controlling the conditions of future governance.","tags":["politics","philosophy"],"collection":"blog","related":[],"cluster":4,"sentimentColor":"#24207f","x":642.4458423495314,"y":-27.86911206068986},
{"id":"2025-01-01-the-letter-to-the-therapeutics.md","label":"The Letter To The Therapeutics","title":"The Letter To The Therapeutics\nblog\nTags: religion, culture","url":"2025-01-01-the-letter-to-the-therapeutics.html","fullTitle":"The Letter To The Therapeutics","description":"The text critiques contemporary therapeutic and social justice culture as a quasi-religious system that perpetuates endless guilt, self-flagellation, and perpetual debt without redemption, arguing that by rejecting traditional religious frameworks while retaining their guilt structures, modern practitioners have created a permanent Friday with no resurrection or release, and urges readers to recognize this as a closed ledger and permission themselves to finish the work and rest.","tags":["religion","culture"],"collection":"blog","related":[],"cluster":6,"sentimentColor":"#17c48e","x":649.9931865904161,"y":675.6499707222019},
{"id":"2025-01-01-you-are-not-your-diagnosis.md","label":"You Are Not Your Diagnosis","title":"You Are Not Your Diagnosis\nblog\nTags: culture","url":"2025-01-01-you-are-not-your-diagnosis.html","fullTitle":"You Are Not Your Diagnosis","description":"Modern society encourages young people to adopt diagnostic labels and trauma narratives as core identities rather than using them as starting points for growth and change, but this approach traps them in suffering rather than leading to healing. The author argues that pain and struggle are inherent to human existence and should be catalysts for action and resilience, not comfortable identities to inhabit, and that overreliance on therapy language, algorithms designed to exploit vulnerability, and the performance of mental illness on social media have replaced genuine strength-building with performative victimhood. True acceptance means treating diagnoses as information to act upon and move through, not as permanent definitions of self, and the path forward requires stepping away from the comfort of labels and returning to the fundamental human capacity to struggle, build, and become something new.","tags":["culture"],"collection":"blog","related":[],"cluster":6,"sentimentColor":"#1fc425","x":408.13126729876944,"y":537.816312888548},
{"id":"2025-12-02-monotheism-oneness-traps.md","label":"Monotheism to Now","title":"Monotheism to Now\nblog\nTags: religion, philosophy, politics","url":"2025-12-02-monotheism-oneness-traps.html","fullTitle":"Monotheism to Now","description":"Monotheism as a cognitive style has created an obsession with singular explanations and grand unifying theories, while real pluralism requires making distinctions between conflicting things and exercising judgment—a capacity modern education has undermined by specializing expertise into narrow lanes and replacing general civic competence with credentialed authority. The educational system's power to shape generations has been destabilized by the internet's competing formation, leaving people assembled from fragments without stable ground, while cascading incentives (not conspiracies) have corrupted professions through debt and manufactured needs, eroding the trust that took generations to build. The Christian inheritance of individual conscience before God contains seeds of both liberation and withdrawal, with the sayings that ground transformation in worldly action and concrete neighbor-care offering a corrective to pure mysticism.","tags":["religion","philosophy","politics"],"collection":"blog","related":[],"cluster":2,"sentimentColor":"#1c7a88","x":778.2295716192292,"y":-488.0646434772294},
{"id":"2025-12-03-state-of-the-union.md","label":"State of the Union","title":"State of the Union\nblog\nTags: philosophy, software","url":"2025-12-03-state-of-the-union.html","fullTitle":"State of the Union","description":"The blog argues that understanding—whether of technical concepts, language design, distributed systems, or philosophical ideas—is fundamentally liberating and enables better choices and freedom. Across a decade of posts, the author consistently advocates for stripping away incidental complexity to expose essential patterns, whether in programming languages, type systems, data management, or thought itself. The through-line connects technical explorations of functional programming and local-first computing with philosophical investigations into how language shapes cognition, how ideas can be dangerous, and how foundational myths constrain what societies can think.","tags":["philosophy","software"],"collection":"blog","related":[],"cluster":8,"sentimentColor":"#488b5e","x":-58.98951024626552,"y":854.0392235409219},
{"id":"2025-12-09-exploring-religin-marx.md","label":"Why Marxism Is Impossible Without Chr...","title":"Why Marxism Is Impossible Without Christian Eschatology\nblog\nTags: philosophy, religion, economics","url":"2025-12-09-exploring-religin-marx.html","fullTitle":"Why Marxism Is Impossible Without Christian Eschatology","description":"Marxism is not a rejection of Christianity but a secular heresy that retains the Christian narrative structure of linear history moving toward apocalyptic salvation, replacing God with material dialectics and the proletariat with the messianic suffering servant. The ideology's dependence on linear time, deterministic historical inevitability, and the promise of a final classless paradise reveals its theological roots in Christian eschatology, transmitted through German philosophy from Luther through Hegel to Marx. By attempting to realize the biblical eschaton (kingdom of God) as an immanent earthly utopia, Marxism represents a gnostic error that inevitably produces tyranny when imperfect humanity fails to match the perfect theoretical vision.","tags":["philosophy","religion","economics"],"collection":"blog","related":[],"cluster":9,"sentimentColor":"#1d47ba","x":-306.1467458920718,"y":739.1036260090294},
{"id":"2025-12-09-monstrous_doubles_girard_essay.md","label":"Monstrous Doubles: René Girard and th...","title":"Monstrous Doubles: René Girard and the Mimetic Inheritance of Religious Structure\nblog\nTags: philosophy, religion, economics","url":"2025-12-09-monstrous_doubles_girard_essay.html","fullTitle":"Monstrous Doubles: René Girard and the Mimetic Inheritance of Religious Structure","description":"René Girard's mimetic theory explains why opposing movements paradoxically become structural mirrors of each other, exemplified by how Marxism replicated Christianity's narrative and institutional forms despite explicitly opposing it. Human desire is fundamentally imitative—we want what others want—and when rivals occupy the same social space, intense opposition generates not distinction but resemblance, as each side mirrors the other's escalations until the distinction between them collapses into what Girard calls a \"monstrous double.\" This framework reveals why contemporary political polarization and historical ideological conflicts show maximum resemblance experienced as maximum difference, rooted in the nature of human desire itself rather than in accidental structural inheritance.","tags":["philosophy","religion","economics"],"collection":"blog","related":[],"cluster":10,"sentimentColor":"#2069ef","x":-565.6854249492379,"y":565.685424949238},
{"id":"2025-12-09-secular_eschaton_essay.md","label":"The Secular Eschaton: Christianity's...","title":"The Secular Eschaton: Christianity's Structural Inheritance in Marxist Thought and Practice\nblog\nTags: philosophy, religion, economics","url":"2025-12-09-secular_eschaton_essay.html","fullTitle":"The Secular Eschaton: Christianity's Structural Inheritance in Marxist Thought and Practice","description":"Marxism structurally inherits Christianity's narrative patterns, institutional forms, and moral grammar despite its explicit atheism, replicating Christian theological architecture at a deep level that explains why Communist movements exhibit characteristic patterns like missionary zeal, heresy-hunting, and eschatological politics. Drawing on scholars including Voegelin, Löwith, and Talmon, the essay argues that modern secular ideologies like Marxism represent a secularization of Christian eschatology—transplanting salvation from the afterlife to earthly political transformation—which generates predictable pathologies when utopian redemption is sought through material history rather than transcendence. This structural inheritance means Marxism functions as a political religion operating through the same psychological and institutional logic as Christianity itself, making the ideology's resemblance to theocratic practice not coincidental but systemic.","tags":["philosophy","religion","economics"],"collection":"blog","related":[],"cluster":9,"sentimentColor":"#1d3edc","x":-365.1362561383374,"y":793.1428495499514},
{"id":"2025-12-10-arhictecture-of-harm.md","label":"🕊️ The Architecture of Harm: How Mod...","title":"🕊️ The Architecture of Harm: How Modern Secular Ideologies Recapitulate Religious Logic\nblog\nTags: philosophy, religion","url":"2025-12-10-arhictecture-of-harm.html","fullTitle":"🕊️ The Architecture of Harm: How Modern Secular Ideologies Recapitulate Religious Logic","description":"Modern secular ideologies like Marxism-Leninism, liberal imperialism, technocratic scientism, and nationalism employ the same moral and structural architecture as ancient religious systems to justify violence and harm, merely replacing religious vocabulary with secular terminology while maintaining identical mechanisms of justification through sacralized events, elite authority, internal rationalization, and mass persuasion. By examining historical atrocities including the Red Terror, Cambodian genocide, Iraq War, Tuskegee experiments, eugenics programs, and genocides in Rwanda and Darfur, the essay demonstrates how these ostensibly rational ideologies replicate religious eschatology, sacrifice logic, ritual purification, and dehumanization to normalize otherwise morally abhorrent actions. The fundamental argument is that the shift from religious to secular modernity has not eliminated the underlying logic of harm but merely disguised it in the language of science, progress, and rational necessity.","tags":["philosophy","religion"],"collection":"blog","related":[],"cluster":9,"sentimentColor":"#2136ba","x":-296.2556542444701,"y":626.3997382942805},
{"id":"2025-12-10-calvinism-to-capitalism.md","label":"From Calvinism to Capitalism","title":"From Calvinism to Capitalism\nblog\nTags: politics, religion, economics","url":"2025-12-10-calvinism-to-capitalism.html","fullTitle":"From Calvinism to Capitalism","description":"Calvin's doctrine of predestination and calling created a psychological and ethical framework that transformed work into a morally mandated, God-accountable activity, spreading from 16th-century Geneva through Protestant Europe and eventually shaping the modern capitalist worker—disciplined, self-policing, frugal, and convinced that diligence in one's vocation both pleases God and signals election. By the 17th century, Puritan preachers had intensified this into an inescapable moral economy where idleness becomes sin, profit becomes legitimate when paired with sobriety and honesty, and economic success becomes readable as divine approval, producing the perfect subject for capitalism: punctual, reliable, self-motivated, and perpetually anxious to prove worth through restless labor.","tags":["politics","religion","economics"],"collection":"blog","related":[],"cluster":9,"sentimentColor":"#2b55a9","x":-221.83898425089367,"y":849.0681717819934},
{"id":"2025-12-10-husk-of-god.md","label":"The Husk of God: Why Atheists Think i...","title":"The Husk of God: Why Atheists Think in Christian\nblog\nTags: politics, religion, history","url":"2025-12-10-husk-of-god.html","fullTitle":"The Husk of God: Why Atheists Think in Christian","description":"Western atheists retain fundamentally Christian thinking patterns despite rejecting God—not in belief but in structure, including moral intuitions about equality and human dignity, linear conceptions of history moving toward justice, and the Christian invention of an inner self requiring examination and confession. Nietzsche recognized that modern secular people inherited Christian ethics without the theological foundation to support them, while Foucault showed how Christianity transformed into secular practices like psychology and therapy that still shape how we understand ourselves. The secular progressive narrative of achieving justice through human effort merely replaces divine redemption with human effort while maintaining the same Christian eschatological structure of fall, struggle, and ultimate redemption.","tags":["politics","religion","history"],"collection":"blog","related":[],"cluster":9,"sentimentColor":"#038097","x":-463.70090354254046,"y":711.2345139483396},
{"id":"2025-12-10-indigenous-violence-slavery-documentation.md","label":"Indigenous Slavery, Conquest, and Chi...","title":"Indigenous Slavery, Conquest, and Child Soldiers: Primary Source Documentation\nblog\nTags: politics, religion","url":"2025-12-10-indigenous-violence-slavery-documentation.html","fullTitle":"Indigenous Slavery, Conquest, and Child Soldiers: Primary Source Documentation","description":"Indigenous African kingdoms including Dahomey, the Zulu, and Benin, as well as Indian civilizations like the Delhi Sultanate and ancient India, perpetrated widespread slavery, conquest, human sacrifice, and recruited child soldiers as young as six or eight years old, demonstrating that violence and exploitation are not unique to any single culture. The document presents primary source evidence showing that Dahomey supplied 20% of the Atlantic slave trade while maintaining domestic slavery, the Zulu incorporated boys as young as six into military service, and the Dahomey Amazons recruited girls from age eight and used brutal desensitization training methods. This evidence is marshaled to support the argument that all cultures have engaged in systemic violence and none can claim moral superiority.","tags":["politics","religion"],"collection":"blog","related":[],"cluster":9,"sentimentColor":"#4d30d9","x":-155.21121024600015,"y":643.0907931207461},
{"id":"2025-12-10-peasent-uprisings.md","label":"Voices from Below: Primary Sources an...","title":"Voices from Below: Primary Sources and the Evolution of Peasant Uprisings\nblog\nTags: politics, religion","url":"2025-12-10-peasent-uprisings.html","fullTitle":"Voices from Below: Primary Sources and the Evolution of Peasant Uprisings","description":"Peasant uprisings across six centuries emerged from genuine violations of the \"moral economy\"—peasants' belief in their right to subsistence and traditional protection—but were structured and led by marginalized elites like radical priests and disaffected scholars who provided organization and ideological frameworks that dispersed rural communities lacked. Primary sources from the Peasants' Revolt in England (1381) and the German Peasants' War (1525) reveal how figures like John Ball and Thomas Müntzer articulated theological and scriptural justifications for rebellion, while established ruling elites countered by redirecting anger, dividing coalitions, and justifying brutal repression. The peasantry supplied the numbers and grievances, while marginalized elites supplied the spark and direction, framing revolt not as revolution but as restoration of violated norms—a pattern that repeated across different civilizations and centuries.","tags":["politics","religion"],"collection":"blog","related":[],"cluster":9,"sentimentColor":"#2d35b8","x":-357.01859245515607,"y":928.3443595397945},
{"id":"2025-12-12-making-sense-of-us-ukraine-negotations.md","label":"Making Sense of US-Ukraine Negotations","title":"Making Sense of US-Ukraine Negotations\nblog\nTags: politics","url":"2025-12-12-making-sense-of-us-ukraine-negotations.html","fullTitle":"Making Sense of US-Ukraine Negotations","description":"Changes in US Ukraine policy under Trump reflect competing strategic doctrines within American foreign policy rather than alignment with Russia. Trump's approach prioritizes transactional deterrence, burden-sharing with Europe, negotiation leverage, and domestic interests over the traditional post-Cold War architecture of sustained alliances and aid commitments. Withholding aid, negotiating with Putin, and appearing to deprioritize Ukraine are tactical choices within this alternative strategic framework, not evidence of a fundamental realignment with Russia, since underlying US institutional structures and long-term rivalry with Russia remain unchanged.","tags":["politics"],"collection":"blog","related":[],"cluster":4,"sentimentColor":"#511162","x":950.9355356460717,"y":-96.01283288828337},
{"id":"2025-12-12-structure-not-vibes-the-real-state.md","label":"Structure, Not Vibes: The Real State...","title":"Structure, Not Vibes: The Real State of the World\nblog\nTags: politics, economics","url":"2025-12-12-structure-not-vibes-the-real-state.html","fullTitle":"Structure, Not Vibes: The Real State of the World","description":"The world's geopolitical and economic outcomes are determined by hard structural forces—geography, energy, trade, and military alliances—rather than ideological \"vibes,\" and by this measure the United States is structurally stronger than ever, having degraded rivals, strengthened alliances, and successfully decoupled from China through tariffs and industrial policy while maintaining macroeconomic dominance. The real vulnerability facing America isn't external military or economic collapse but internal narrative breakdown, as a population fed algorithmic outrage loses faith in institutions that are actually functioning effectively.","tags":["politics","economics"],"collection":"blog","related":[],"cluster":4,"sentimentColor":"#3a005e","x":749.1281534369158,"y":189.24073353076503},
{"id":"2025-12-12-the-vulnerability-principle.md","label":"The Vulnerability Principle","title":"The Vulnerability Principle\nblog\nTags: politics","url":"2025-12-12-the-vulnerability-principle.html","fullTitle":"The Vulnerability Principle","description":"When a powerful political figure faces legal threats, their vulnerability becomes a lever that fundamentally reshapes their coalition's incentive structure, forcing them toward strategies that simultaneously protect the leader while advancing the ideological and institutional agendas of surrounding factions. Different coalitional groups—including post-liberal intellectuals seeking institutional re-foundation, traditional GOP power brokers preferring stability, anti-administrative-state actors pursuing civil service reform, and opportunistic figures seeking relevance—each use the leader's jeopardy to push toward outcomes that serve their own interests. The result is a constrained \"Pareto frontier\" where the leader's survival becomes intertwined with structural change that benefits the entire coalition, meaning the leader's personal crisis paradoxically becomes the vehicle for their followers' larger ambitions.","tags":["politics"],"collection":"blog","related":[],"cluster":4,"sentimentColor":"#5f195a","x":702.4443708068579,"y":-187.8374276142275},
{"id":"2025-12-12-trumps-techno-fetish.md","label":"Trump's Techno-Fetish","title":"Trump's Techno-Fetish\nblog\nTags: politics, economics","url":"2025-12-12-trumps-techno-fetish.html","fullTitle":"Trump's Techno-Fetish","description":"Trump's push against the EU stems partly from viewing its digital regulations as a de facto tariff system targeting U.S. tech companies, with compliance costs reaching $97.6 billion annually for American firms through direct expenses, fines, and lost revenue. The EU's regulatory framework—encompassing GDPR, DMA, DSA, and the AI Act—has grown from 27 pages in 2015 to 931 pages by 2024, with fines disproportionately hitting American companies (83% of GDPR penalties) while European firms face minimal penalties. By threatening to weaken these regulations in exchange for EU cooperation on Ukraine and defense, Trump is leveraging geopolitical leverage to reduce what he frames as protectionist barriers against American technology companies.","tags":["politics","economics"],"collection":"blog","related":[],"cluster":4,"sentimentColor":"#791465","x":1012.5441466699912,"y":77.62078147200849},
{"id":"2025-12-12-why-cultures-differentiate.md","label":"Why Cultures Differentiate","title":"Why Cultures Differentiate\nblog\nTags: history, culture","url":"2025-12-12-why-cultures-differentiate.html","fullTitle":"Why Cultures Differentiate","description":"Different geographic and coordination challenges created distinct selection pressures that shaped cultures over generations: hydraulic civilizations like Egypt and China rewarded literate bureaucrats and procedural conformity needed to manage floods, steppe pastoralists selected for martial meritocracy and charismatic leaders capable of mobile warfare, maritime traders favored commercial risk-assessment and rhetorical persuasion, desert societies developed legal-jurisprudential expertise and memorization skills, and conquered peoples like ancient Israel emphasized textual expertise and diaspora network management. Each environment's unique coordination problem produced a distinct fitness landscape that rewarded specific cognitive profiles, social skills, and institutional types, explaining why recognizable cultural personality archetypes emerged across history.","tags":["history","culture"],"collection":"blog","related":[],"cluster":9,"sentimentColor":"#633b94","x":-403.70237508521393,"y":551.2661983948019},
{"id":"2025-12-15-burnout-is-a-modern-invention.md","label":"Burnout is a Modern Invention","title":"Burnout is a Modern Invention\nblog\nTags: culture, economics, history","url":"2025-12-15-burnout-is-a-modern-invention.html","fullTitle":"Burnout is a Modern Invention","description":"Burnout is not a timeless human experience but a distinctly modern phenomenon created by capitalism's moral valorization of endless productive work. Pre-capitalist societies—from ancient Athens to medieval Europe—viewed work as a necessary burden and leisure as the true good, with natural stopping points built into life through festivals, philosophy, or retirement to estates. The transformation began with Calvinist theology, which made work a moral calling and prosperity a sign of divine election, creating psychological compulsion for endless accumulation even after the religious framework disappeared. Today's achievement-oriented subject experiences this legacy as pure internalized moral imperative: rest feels like failure, idleness like sin, and exhaustion like personal inadequacy rather than systemic exploitation.","tags":["culture","economics","history"],"collection":"blog","related":[],"cluster":2,"sentimentColor":"#206e5f","x":343.8424914761649,"y":-474.11188691525325},
{"id":"2025-12-15-know-thyself-confucian-buddhist-hindu.md","label":"Know Thyself: Confucian, Buddhist, Hindu","title":"Know Thyself: Confucian, Buddhist, Hindu\nblog\nTags: philosophy, religion","url":"2025-12-15-know-thyself-confucian-buddhist-hindu.html","fullTitle":"Know Thyself: Confucian, Buddhist, Hindu","description":"Buddhism asks whether a self exists to know at all and teaches that clinging to self is the root of suffering, whereas Confucianism dissolves the self into relational roles and emphasizes self-cultivation through proper conduct rather than introspection, and Hinduism suggests that the self we ordinarily perceive is illusory while pointing to a deeper, unchanging self beyond the phenomenal world. These three traditions offer radically different approaches to self-knowledge grounded in distinct philosophical assumptions and lived practices like meditation, ritual, and contemplation.","tags":["philosophy","religion"],"collection":"blog","related":[],"cluster":10,"sentimentColor":"#24b9c5","x":-624.6749351955035,"y":619.72464849016},
