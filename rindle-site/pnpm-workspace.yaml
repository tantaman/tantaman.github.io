# Makes rindle-site its own pnpm workspace root so `pnpm install` resolves this
# app's dependencies here (its own node_modules + lockfile), instead of pnpm
# walking up to the parent tantaman.github.io workspace and ignoring this app.
packages: []
allowBuilds:
  better-sqlite3: true
  esbuild: true
  # Optional image transform path; this app does not import sharp.
  sharp: false
  workerd: true
minimumReleaseAgeExclude:
  - '@rindle/api-server@0.7.3 || 0.7.8 || 0.7.10 || 0.8.0 || 0.9.0 || 0.10.0'
  - '@rindle/cli-darwin-arm64@0.7.3 || 0.7.8 || 0.7.10 || 0.8.0 || 0.9.0 || 0.10.0'
  - '@rindle/cli-darwin-x64@0.7.3 || 0.7.8 || 0.7.10 || 0.8.0 || 0.9.0 || 0.10.0'
