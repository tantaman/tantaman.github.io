name = "tantamanlands"
main = "src/index.ts"
compatibility_date = "2025-03-03"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "tantaman.com/api", zone_name = "tantaman.com" },
  { pattern = "tantaman.com/api/", zone_name = "tantaman.com" },
  { pattern = "tantaman.com/api/*", zone_name = "tantaman.com" },
  { pattern = "tantaman.com/audio/*", zone_name = "tantaman.com" },
  { pattern = "tantaman.com/search.json", zone_name = "tantaman.com" },
  { pattern = "tantaman.com/paste", zone_name = "tantaman.com" },
  { pattern = "tantaman.com/paste/*", zone_name = "tantaman.com" },
  { pattern = "tantaman.com/now", zone_name = "tantaman.com" },
  { pattern = "tantaman.com/now*", zone_name = "tantaman.com" },
  { pattern = "tantaman.com/thoughts/t/*", zone_name = "tantaman.com" },
  { pattern = "tantaman.com/thoughts/*", zone_name = "tantaman.com" }
]

[[kv_namespaces]]
binding = "KV"
id = "c616f080e03e4c1292ff8004b93cbd0b"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "thought"
database_id = "a1190a47-fe1e-4fdb-8d7a-06dd5714fc6b"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "thought-attachments"

[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "tantaman-audio"

# Generated, regenerable site assets kept out of the git repo (e.g. the blog
# search index). Create once with: wrangler r2 bucket create tantaman-site
[[r2_buckets]]
binding = "SITE_BUCKET"
bucket_name = "tantaman-site"

[[vectorize]]
binding = "VECTORIZE"
index_name = "thought-embeddings"

[[durable_objects.bindings]]
name = "DOC_COLLAB"
class_name = "DocCollabRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DocCollabRoom"]

[[workflows]]
name = "tts-workflow"
binding = "TTS_WORKFLOW"
class_name = "TtsWorkflow"

[triggers]
# Weekly digest email — Mondays at 14:00 UTC (~6/7am PT)
crons = ["0 14 * * 1"]

[observability]
[observability.logs]
enabled = false
invocation_logs = true
