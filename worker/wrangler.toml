name = "tantamanlands-legacy"
main = "src/index.ts"
compatibility_date = "2025-03-03"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Retired after the Rindle rewrite cutover. Keep the Worker deployable for rollback, but do not
# expose it on workers.dev or re-attach production routes.
routes = []

[[kv_namespaces]]
binding = "KV"
id = "c616f080e03e4c1292ff8004b93cbd0b"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "thought"
database_id = "a1190a47-fe1e-4fdb-8d7a-06dd5714fc6b"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "thought-attachments"

[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "tantaman-audio"

[[vectorize]]
binding = "VECTORIZE"
index_name = "thought-embeddings"

[[durable_objects.bindings]]
name = "DOC_COLLAB"
class_name = "DocCollabRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DocCollabRoom"]

[[workflows]]
name = "tts-workflow"
binding = "TTS_WORKFLOW"
class_name = "TtsWorkflow"

[triggers]
crons = []

[observability]
[observability.logs]
enabled = false
invocation_logs = true
